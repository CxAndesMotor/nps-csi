<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en Mantenimiento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        p {
            font-size: 15px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background-color: #e1f5fe;
            color: #0288d1;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Sitio Temporalmente Fuera de Servicio</h1>
        <p>Estamos realizando tareas de mantenimiento y actualización en la plataforma. Volveremos a estar disponibles en breve.</p>
        <span class="badge">En Mantenimiento</span>
    </div>
</body>
</html>
